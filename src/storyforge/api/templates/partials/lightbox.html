<div id="lightbox" class="lightbox hidden" aria-hidden="true">
  <div class="lightbox-backdrop" data-lightbox-close="true"></div>
  <div class="lightbox-dialog" role="dialog" aria-modal="true" aria-label="StoryForge preview">
    <div class="lightbox-head">
      <div>
        <p class="section-kicker">Preview</p>
        <h3 id="lightbox-title">内容预览</h3>
        <p id="lightbox-position" class="lightbox-position"></p>
      </div>

      <div class="lightbox-actions">
        <button type="button" id="lightbox-prev" class="secondary">上一项</button>
        <button type="button" id="lightbox-next" class="secondary">下一项</button>
        <a id="lightbox-open-raw" class="topbar-link" href="#" target="_blank" rel="noreferrer">打开原文件</a>
        <button type="button" id="lightbox-close" class="secondary">关闭</button>
      </div>
    </div>
    <div id="lightbox-content" class="lightbox-content"></div>
  </div>
</div>
