name: Bug Report
description: Report a reproducible bug in StoryForge.
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug.

        Please provide a minimal, reproducible description. If the issue is model/provider-specific, include the exact provider and model configuration.

  - type: textarea
    id: summary
    attributes:
      label: Bug Summary
      description: What is broken?
      placeholder: A concise description of the bug.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      description: List the exact steps needed to reproduce the issue.
      placeholder: |
        1. Start the API with ...
        2. Create a story project with ...
        3. Click ...
        4. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: What should have happened?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      placeholder: What actually happened? Include error messages if possible.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      options:
        - Web UI
        - API
        - Task Queue
        - Novel Generation
        - Character Images
        - Scene Images
        - Video Pipeline
        - Persistence / Database
        - Docs / README
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the runtime and provider details that matter.
      placeholder: |
        OS:
        Python:
        Install method:
        LLM provider/model:
        Image provider/model:
        Video provider/model:
        Database:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, Traceback, or Screenshots
      description: Paste the relevant output only.
      render: shell

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I checked the README and docs before opening this issue.
          required: true
        - label: I searched existing issues and did not find the same report.
          required: true
        - label: I can reproduce this issue consistently.
          required: false
