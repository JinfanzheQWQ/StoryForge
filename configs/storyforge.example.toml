[llm]
enabled = true
provider = "deepseek"
model = "deepseek-chat"
temperature = 0.7
max_tokens = 8192
api_key_env = "DEEPSEEK_API_KEY"
base_url = "https://api.deepseek.com/v1"
timeout_seconds = 120

[novel]
default_chapter_count = 8
default_chapter_word_target = 2500
chapter_scene_count = 3

[video]
segment_duration_seconds = 5
aspect_ratio = "16:9"
fps = 24
character_image_provider = "seedream-4.5"
scene_image_provider = "seedream-4.5"
submit_seedance = true

[seedream]
enabled = true
base_url = ""
api_key_env = "SEEDREAM_API_KEY"
model = "doubao-seedream-4-5-251128"
auto_submit = false
image_size = "2K"
response_format = "url"
watermark = false
download_outputs = true

[gpt_image]
enabled = true
provider = "kie" # "kie" or "openai"
model = "gpt-image-2"
kie_base_url = "https://api.kie.ai"
kie_api_key_env = "KIE_API_KEY"
kie_text_to_image_model = "gpt-image-2-text-to-image"
kie_image_to_image_model = "gpt-image-2-image-to-image"
openai_base_url = "https://api.openai.com/v1"
openai_api_key_env = "OPENAI_API_KEY"
quality = "auto"
output_format = "png"
download_outputs = true
poll_interval_seconds = 3.0
max_wait_seconds = 900

[seedance]
enabled = true
base_url = ""
api_key_env = "SEEDANCE_API_KEY"
model = "doubao-seedance-2-0-260128"
auto_submit = false
with_audio = true
subtitle_mode = "burned_in"
subtitle_style = "底部居中中文硬字幕，白字黑边，电影感，无额外花字"
watermark = false
download_outputs = true
poll_interval_seconds = 5.0
max_wait_seconds = 900

[database]
host = "127.0.0.1"
port = 3306
user = "root"
password = ""
password_env = "STORYFORGE_DB_PASSWORD"
database = "storyforge"
charset = "utf8mb4"
connect_timeout_seconds = 5
auto_create_schema = true

[queue]
concurrency = 2
poll_interval_seconds = 0.2

[api]
cors_origins = ["http://localhost:5173", "http://127.0.0.1:5173"]

[paths]
output_dir = "outputs"
prompt_dir = "prompts"
