<div id="confirm-dialog" class="confirm-dialog hidden" aria-hidden="true">
  <div class="confirm-backdrop" data-confirm-cancel="true"></div>
  <section class="confirm-card" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="confirm-mark" aria-hidden="true">!</div>
    <div class="confirm-body">
      <p id="confirm-eyebrow" class="section-kicker">Confirm</p>
      <h3 id="confirm-title">确认操作</h3>
      <p id="confirm-message" class="confirm-message"></p>
      <ul id="confirm-details" class="confirm-details"></ul>
    </div>
    <div class="confirm-actions">
      <button type="button" id="confirm-cancel" class="secondary">取消</button>
      <button type="button" id="confirm-submit" class="danger-button confirm-submit">确认</button>
    </div>
  </section>
</div>
