<section class="page-panel" data-page-panel="projects">
  <div class="page-stage">
    <header class="page-header">
      <div>
        <p class="section-kicker">Story Library</p>
        <h2>按故事查看版本与作品资产</h2>
        <p>这里会把同一个故事的不同制作版本整理在一起，方便比较文本、图片和视频结果。</p>
      </div>
    </header>

    <div class="management-layout">
      <aside class="panel list-panel">
        <div class="panel-head">
          <p class="section-kicker">Stories</p>
          <h2>故事列表</h2>
          <p>选择一个故事，查看它的版本记录、图片素材和成片结果。</p>
        </div>
        <div id="project-list" class="list-stack">
          <article class="empty-state">
            <h3>还没有故事</h3>
            <p>先创建一个故事文本任务，完成后这里会出现对应的故事档案。</p>
          </article>
        </div>
      </aside>

      <section class="panel detail-page">
        <div id="project-detail-view" class="detail-view">
          <article class="empty-state">
            <h3>等待选择故事</h3>
            <p>从左侧选中一个故事，这里会展示版本对比、阶段状态以及图片和视频资产。</p>
          </article>
        </div>
      </section>
    </div>
  </div>
</section>
