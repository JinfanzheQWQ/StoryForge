<section class="page-panel" data-page-panel="project-detail">
  <div class="page-stage">
    <header class="page-header page-header-detail">
      <div>
        <p class="section-kicker">Story Detail</p>
        <h2>作品详情与版本资产</h2>
        <p>在这一页查看同一个故事的版本、正文、素材、视频和阶段状态。制作进度已经完全并入作品详情。</p>
      </div>
      <div class="detail-top-actions">
        <button type="button" class="secondary" data-go-page="projects">返回作品库</button>
        <button type="button" class="secondary" id="refresh-button">立即刷新</button>
        <div class="queue-status">
          <span class="queue-status-dot"></span>
          <strong id="poll-indicator">同步中</strong>
        </div>
      </div>
    </header>

    <section class="panel detail-page detail-page-full">
      <div id="project-detail-view" class="detail-view detail-view-full">
        <article class="empty-state">
          <h3>等待选择故事</h3>
          <p>从作品库点击任意项目后，这里会展开该故事的版本时间线、图片与视频资产。</p>
        </article>
      </div>
    </section>
  </div>
</section>
