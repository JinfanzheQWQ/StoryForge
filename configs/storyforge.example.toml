[llm]
enabled = true
provider = "deepseek"
model = "deepseek-chat"
available_providers = ["deepseek", "openai"]
temperature = 0.7
api_key_env = "DEEPSEEK_API_KEY"
base_url = "https://api.deepseek.com/v1"
timeout_seconds = 120

[novel]
default_chapter_count = 8
default_chapter_word_target = 2500
chapter_scene_count = 3

[video]
segment_duration_seconds = 5
aspect_ratio = "16:9"
fps = 24
character_image_provider = "seedream-4.5"
scene_image_provider = "seedream-4.5"
submit_seedance = true

[seedream]
enabled = true
base_url = ""
api_key_env = "SEEDREAM_API_KEY"
model = "doubao-seedream-4-5-251128"
auto_submit = false
image_size = "2K"
response_format = "url"
download_outputs = true

[seedance]
enabled = true
base_url = ""
api_key_env = "SEEDANCE_API_KEY"
model = "doubao-seedance-2-0-260128"
auto_submit = false
with_audio = true
subtitle_mode = "burned_in"
subtitle_style = "底部居中中文硬字幕，白字黑边，电影感，无额外花字"
watermark = false
download_outputs = true
poll_interval_seconds = 5.0
max_wait_seconds = 900

[database]
host = "127.0.0.1"
port = 3306
user = "root"
password = ""
password_env = "STORYFORGE_DB_PASSWORD"
database = "storyforge"
charset = "utf8mb4"
connect_timeout_seconds = 5
auto_create_schema = true

[queue]
concurrency = 2
poll_interval_seconds = 0.2

[paths]
output_dir = "outputs"
prompt_dir = "prompts"
