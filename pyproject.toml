[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "storyforge"
version = "0.1.0"
description = "Agent-based scaffold for novel generation and novel-to-video pipelines."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "StoryForge Team" },
]
dependencies = [
  "fastapi",
  "httpx>=0.28.0",
  "langchain[openai]>=1.2.0",
  "PyMySQL>=1.1.1",
  "uvicorn[standard]",
]

[project.scripts]
storyforge = "storyforge.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.8.0",
]

[tool.uv]
package = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
